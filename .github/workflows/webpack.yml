name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Dependencies
      run: npm install

    - name: Type-check
      run: npx tsc --noEmit

    - name: Run Tests
      run: npm test -- --watchAll=false --forceExit

    - name: Build
      run: |
        npm run build
        # NOTE: do not run `npm run web` here - it starts the webpack dev server, which never exits and hangs CI.
